# ==============================================================================
# NPO ODOO DOCKER - TURNKEY DOCKER COMPOSE V2
# Inisiatif Sistem ERP Terpadu Lembaga Nirlaba Indonesia
# Standar: BWI (PSAK 412), BAZNAS (PSAK 109), Kemensos (ISAK 35)
# Arsitektur 3-Tier: Caddy 2 (Proxy) -> Odoo 19/18 LTS (Web) -> PostgreSQL 17/16 (DB)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE SERVICE: PostgreSQL 17 / 16 Alpine
  # ----------------------------------------------------------------------------
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: ${CONTAINER_PREFIX:-npo}_odoo_db
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      -c work_mem=${POSTGRES_WORK_MEM:-16MB}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - npo-network
    # Zero host exposure: Port 5432 terisolasi total dalam jaringan internal docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. WEB SERVICE: Odoo 19 / 18 LTS Community Edition
  # ----------------------------------------------------------------------------
  web:
    image: ${ODOO_IMAGE:-odoo:19.0}
    # Untuk build image lokal dengan dependensi Python lengkap (PSAK, Excel, QR Code):
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     ODOO_BASE_IMAGE: ${ODOO_IMAGE:-odoo:19.0}
    container_name: ${CONTAINER_PREFIX:-npo}_odoo_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./extra-addons:/mnt/extra-addons
    expose:
      - "8069" # Odoo HTTP / XML-RPC
      - "8072" # Odoo WebSockets / Longpolling
    # Zero host exposure: Port 8069 & 8072 hanya dapat diakses melalui reverse proxy Caddy
    networks:
      - npo-network

  # ----------------------------------------------------------------------------
  # 3. REVERSE PROXY SERVICE: Caddy 2 Alpine (Auto-SSL Let's Encrypt & WebSockets)
  # ----------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    container_name: ${CONTAINER_PREFIX:-npo}_odoo_proxy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3 Support (QUIC)
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@npo.id}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - npo-network

# ------------------------------------------------------------------------------
# VOLUMES PERSISTEN
# ------------------------------------------------------------------------------
volumes:
  odoo-web-data:
    name: ${VOLUME_PREFIX:-npo}_odoo_web_data
  odoo-db-data:
    name: ${VOLUME_PREFIX:-npo}_odoo_db_data
  caddy-data:
    name: ${VOLUME_PREFIX:-npo}_caddy_data
  caddy-config:
    name: ${VOLUME_PREFIX:-npo}_caddy_config

# ------------------------------------------------------------------------------
# ISOLASI JARINGAN INTERNAL
# ------------------------------------------------------------------------------
networks:
  npo-network:
    name: ${NETWORK_NAME:-npo_internal_network}
    driver: bridge
